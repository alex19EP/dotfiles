# Register the Orca audio-ducking actuator as a WirePlumber component.
#
# Script lives at ~/.local/share/wireplumber/scripts/orca-ducking.lua; it owns
# the "orca-ducking" metadata object that the Orca extension
# ~/.local/share/orca/extensions/audio_ducking.py writes the duck level to.
# Like the dongle mirror, the script pcall-wraps its setup so it can never
# stop WirePlumber from starting.

wireplumber.components = [
  {
    name = orca-ducking.lua
    type = script/lua
    provides = custom.orca-ducking
  }
]

wireplumber.profiles = {
  main = {
    custom.orca-ducking = required
  }
}
